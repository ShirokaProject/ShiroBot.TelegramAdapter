name: Build and release adapter

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ShiroBot.TelegramAdapter.csproj
      - name: Build
        run: dotnet build ShiroBot.TelegramAdapter.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
      - name: Build development test plugin
        run: dotnet build TestPlugin/ShiroBot.TelegramAdapter.TestPlugin.csproj -c Release /p:ContinuousIntegrationBuild=true
      - name: Verify adapter contracts
        run: dotnet run --project Tests/Verification/Verification.csproj -c Release
      - name: Rebuild distributable after contract verification
        run: dotnet build ShiroBot.TelegramAdapter.csproj -c Release --no-restore -t:Rebuild /p:ContinuousIntegrationBuild=true
      - name: Check packaged component version
        shell: bash
        run: |
          version="$(dotnet msbuild ShiroBot.TelegramAdapter.csproj -getProperty:Version -p:Configuration=Release)"
          expected="$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          dotnet run --project scripts/version-check/VersionCheck.csproj -c Release -- \
            "bin/Release/net10.0/ShiroBot.TelegramAdapter.dll" "$version" "$expected"
      - name: Package
        run: |
          test -f bin/Release/net10.0/ShiroBot.TelegramAdapter.dll
          test ! -f bin/Release/net10.0/ShiroBot.TelegramAdapter.TestPlugin.dll
          mkdir -p artifacts
          (cd bin/Release/net10.0 && zip -qr "$GITHUB_WORKSPACE/artifacts/ShiroBot.TelegramAdapter.zip" . -x '*.[pP][dD][bB]')
          cp bin/Release/net10.0/ShiroBot.TelegramAdapter.dll artifacts/ShiroBot.TelegramAdapter.dll
      - uses: actions/upload-artifact@v4
        with:
          name: adapter-package
          path: |
            artifacts/ShiroBot.TelegramAdapter.zip
            artifacts/ShiroBot.TelegramAdapter.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adapter-package
          path: artifacts
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/ShiroBot.TelegramAdapter.zip artifacts/ShiroBot.TelegramAdapter.dll --clobber
          else
            gh release create "$tag" artifacts/ShiroBot.TelegramAdapter.zip artifacts/ShiroBot.TelegramAdapter.dll --title "$tag" --generate-notes
          fi
